
name: Amrutam Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Tests, Coverage and Security Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrutam_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: amrutam_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U amrutam_test -d amrutam_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-secret-for-ci
      DATABASE_URL: postgresql://amrutam_test:local_test_password@localhost:5433/amrutam_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage thresholds
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit development dependencies
        run: npm audit --audit-level=moderate

      - name: Build production Docker image
        run: docker build -t amrutam-backend:${{ github.sha }} .
